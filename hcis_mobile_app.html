<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HCIS OS — Mobile App</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root {
  --ios-bg: #f2f2f7;
  --ios-grouped-bg: #f2f2f7;
  --ios-card: #ffffff;
  --ios-card-2: #f9f9fb;
  --ios-separator: rgba(60,60,67,.12);
  --ios-text: #000;
  --ios-text-2: #3c3c43;
  --ios-text-3: rgba(60,60,67,.6);
  --ios-text-4: rgba(60,60,67,.3);
  --ios-blue: #007aff;
  --ios-green: #34c759;
  --ios-red: #ff3b30;
  --ios-orange: #ff9500;
  --ios-yellow: #ffcc00;
  --ios-purple: #af52de;
  --ios-gray: #8e8e93;
  --ios-fill: rgba(120,120,128,.12);
  --ios-fill-2: rgba(120,120,128,.16);
  --safe-bottom: env(safe-area-inset-bottom, 0);
  --safe-top: env(safe-area-inset-top, 0);
  --tabbar-h: 56px;
  --topbar-h: 44px;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Pretendard", sans-serif;
  background: var(--ios-bg);
  color: var(--ios-text);
  display: flex;
  flex-direction: column;
  height: 100%;
}

.mi {
  font-family: 'Material Icons';
  font-size: 20px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-style: normal;
  font-weight: normal;
  -webkit-font-feature-settings: 'liga';
  font-feature-settings: 'liga';
  -webkit-font-smoothing: antialiased;
}

/* LOGIN SCREEN */
#login-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 32px 24px;
  background: var(--ios-bg);
  z-index: 999;
}

#login-screen.hidden {
  display: none !important;
}

.login-logo {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--ios-text);
}

.login-subtitle {
  font-size: 14px;
  color: var(--ios-text-3);
  margin-bottom: 40px;
  text-align: center;
}

.login-button {
  width: 100%;
  padding: 14px 16px;
  margin-bottom: 12px;
  border: 1px solid var(--ios-separator);
  border-radius: 12px;
  background: var(--ios-card);
  font-size: 16px;
  font-weight: 600;
  color: var(--ios-blue);
  cursor: pointer;
  transition: all 0.15s;
}

.login-button:active {
  background: var(--ios-card-2);
}

/* APP SHELL */
#app-shell {
  display: none;
  flex-direction: column;
  height: 100%;
  position: relative;
}

#app-shell.visible {
  display: flex !important;
}

/* TOP NAV BAR */
.ios-topbar {
  position: sticky;
  top: 0;
  height: var(--topbar-h);
  background: rgba(248, 248, 248, 0.8);
  backdrop-filter: blur(20px);
  border-bottom: 0.5px solid var(--ios-separator);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  z-index: 99;
}

.ios-topbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.ios-hamburger {
  width: 32px;
  height: 32px;
  background: var(--ios-fill);
  border-radius: 8px;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--ios-text);
}

.ios-topbar-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--ios-text);
}

.ios-topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.ios-avatar-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--ios-blue);
  color: white;
  border: none;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* DRAWER / SIDEBAR */
.ios-drawer-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.3);
  z-index: 198;
}

.ios-drawer-overlay.open {
  display: block;
}

.ios-drawer {
  position: fixed;
  left: -280px;
  top: 0;
  width: 280px;
  height: 100%;
  background: var(--ios-card);
  border-right: 0.5px solid var(--ios-separator);
  overflow-y: auto;
  transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 199;
}

.ios-drawer.open {
  left: 0;
}

.ios-drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(var(--safe-top) + 12px) 16px 12px;
  border-bottom: 0.5px solid var(--ios-separator);
}

.ios-drawer-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--ios-text);
}

.ios-drawer-close {
  width: 28px;
  height: 28px;
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 18px;
  color: var(--ios-gray);
  display: flex;
  align-items: center;
  justify-content: center;
}

.ios-drawer-section {
  padding: 16px 0;
  border-bottom: 0.5px solid var(--ios-separator);
}

.ios-drawer-section:last-child {
  border-bottom: none;
}

.ios-drawer-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  font-size: 14px;
  color: var(--ios-text-2);
  cursor: pointer;
  transition: all 0.15s;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
  font-family: inherit;
}

.ios-drawer-item:active {
  background: var(--ios-fill);
}

.ios-drawer-item.divider {
  height: 0.5px;
  background: var(--ios-separator);
  padding: 0;
  cursor: default;
  margin: 4px 0;
}

.ios-drawer-item.active {
  color: var(--ios-blue);
  font-weight: 600;
}

.ios-drawer-icon {
  width: 28px;
  text-align: center;
  font-size: 18px;
}

.ios-drawer-label {
  flex: 1;
}

.ios-role-switcher {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
}

.ios-role-badge {
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  background: var(--ios-fill);
  color: var(--ios-text-3);
}

.ios-role-toggle {
  width: 44px;
  height: 28px;
  border-radius: 14px;
  border: none;
  background: var(--ios-fill);
  cursor: pointer;
  position: relative;
  transition: background 0.3s;
}

.ios-role-toggle.active {
  background: var(--ios-green);
}

.ios-role-toggle::after {
  content: '';
  position: absolute;
  width: 26px;
  height: 26px;
  border-radius: 13px;
  background: white;
  top: 1px;
  left: 1px;
  transition: left 0.3s;
}

.ios-role-toggle.active::after {
  left: 17px;
}

/* MAIN CONTENT AREA */
.ios-main {
  flex: 1;
  overflow-y: auto;
  padding: 0 0 calc(var(--tabbar-h) + var(--safe-bottom) + 16px) 0;
  padding-top: 16px;
}

.ios-section {
  display: none;
}

.ios-section.active {
  display: block;
  animation: fadeInUp 0.25s ease;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* PAGE STRUCTURE */
.ios-page-header {
  padding: 0 16px 12px;
}

.ios-large-title {
  font-size: 32px;
  font-weight: 700;
  color: var(--ios-text);
  margin: 0;
}

.ios-page-subtitle {
  font-size: 13px;
  color: var(--ios-text-3);
  margin: 4px 0 0;
}

/* CARDS & LISTS */
.ios-card {
  background: var(--ios-card);
  border-radius: 12px;
  margin: 8px 16px;
  overflow: hidden;
  border: 0.5px solid var(--ios-separator);
}

.ios-card-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--ios-text-3);
  padding: 12px 16px 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.ios-list {
  background: var(--ios-card);
  border-radius: 12px;
  margin: 8px 16px;
  overflow: hidden;
  border: 0.5px solid var(--ios-separator);
}

.ios-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  min-height: 44px;
  border-bottom: 0.5px solid var(--ios-separator);
}

.ios-row:last-child {
  border-bottom: none;
}

.ios-row-tappable {
  cursor: pointer;
  transition: background 0.15s;
}

.ios-row-tappable:active {
  background: var(--ios-fill);
}

.ios-row-icon {
  width: 24px;
  text-align: center;
  font-size: 18px;
  color: var(--ios-text-3);
}

.ios-row-content {
  flex: 1;
  min-width: 0;
}

.ios-row-label {
  font-size: 16px;
  color: var(--ios-text);
  margin: 0;
}

.ios-row-detail {
  font-size: 13px;
  color: var(--ios-text-3);
  margin: 2px 0 0;
}

.ios-row-chevron {
  color: var(--ios-text-4);
  font-size: 18px;
}

/* BUTTONS */
.ios-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  font-family: inherit;
}

.ios-button-primary {
  background: var(--ios-blue);
  color: white;
}

.ios-button-primary:active {
  opacity: 0.7;
}

.ios-button-secondary {
  background: var(--ios-fill);
  color: var(--ios-text);
}

.ios-button-secondary:active {
  background: var(--ios-fill-2);
}

.ios-button-danger {
  background: var(--ios-red);
  color: white;
}

.ios-button-danger:active {
  opacity: 0.7;
}

.ios-button-block {
  width: 100%;
  padding: 12px 16px;
}

/* FORMS */
.ios-form-group {
  margin-bottom: 16px;
}

.ios-form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--ios-text);
  margin-bottom: 6px;
}

.ios-form-input,
.ios-form-select,
.ios-form-textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--ios-separator);
  border-radius: 8px;
  font-size: 16px;
  font-family: inherit;
  color: var(--ios-text);
  background: var(--ios-card);
}

.ios-form-textarea {
  resize: vertical;
  min-height: 100px;
}

.ios-form-input:focus,
.ios-form-select:focus,
.ios-form-textarea:focus {
  outline: none;
  border-color: var(--ios-blue);
  box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
}

/* BOTTOM TAB BAR */
.ios-tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: calc(var(--tabbar-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(248, 248, 248, 0.85);
  backdrop-filter: blur(20px);
  border-top: 0.5px solid var(--ios-separator);
  display: flex;
  z-index: 100;
}

.ios-tabbar-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 10px;
  color: var(--ios-gray);
  cursor: pointer;
  border: none;
  background: transparent;
  font-family: inherit;
  transition: color 0.15s;
}

.ios-tabbar-item.active {
  color: var(--ios-blue);
}

.ios-tabbar-icon {
  font-size: 24px;
}

.ios-tabbar-label {
  font-size: 10px;
  font-weight: 500;
}

/* MODALS */
.ios-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  z-index: 200;
  animation: fadeIn 0.2s ease;
}

.ios-modal-overlay.open {
  display: flex;
  align-items: flex-end;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.ios-modal {
  width: 100%;
  background: var(--ios-card);
  border-radius: 16px 16px 0 0;
  padding: 16px;
  animation: slideUp 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  max-height: 90vh;
  overflow-y: auto;
  padding-bottom: calc(16px + var(--safe-bottom));
}

@keyframes slideUp {
  from {
    transform: translateY(100%);
  }
  to {
    transform: none;
  }
}

.ios-modal-handle {
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: var(--ios-text-4);
  margin: 8px auto 16px;
}

.ios-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.ios-modal-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--ios-text);
}

.ios-modal-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--ios-fill);
  border: none;
  cursor: pointer;
  font-size: 18px;
  color: var(--ios-gray);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* SEGMENTED CONTROL */
.ios-segmented {
  display: inline-flex;
  background: var(--ios-fill);
  border-radius: 8px;
  padding: 4px;
  gap: 4px;
}

.ios-segmented-item {
  padding: 6px 12px;
  border-radius: 6px;
  border: none;
  background: transparent;
  font-size: 13px;
  font-weight: 600;
  color: var(--ios-gray);
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}

.ios-segmented-item.active {
  background: var(--ios-card);
  color: var(--ios-text);
}

/* BADGES & TAGS */
.ios-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 10px;
  background: var(--ios-red);
  color: white;
  font-size: 11px;
  font-weight: 600;
}

.ios-tag {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  background: var(--ios-fill);
  color: var(--ios-text-3);
}

.tag.green { background: var(--ios-green); color: white; }
.tag.red { background: var(--ios-red); color: white; }
.tag.blue { background: var(--ios-blue); color: white; }
.tag.orange { background: var(--ios-orange); color: white; }

/* RESPONSIVE */
@media (min-width: 769px) {
  #login-screen {
    display: none !important;
  }

  #app-shell {
    display: flex !important;
  }

  .ios-tabbar {
    display: none !important;
  }
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-logo">HCIS</div>
  <div class="login-subtitle">학원 관리 시스템에 로그인하세요</div>
  <button class="login-button" onclick="selectRole('hq')">본사 관리자</button>
  <button class="login-button" onclick="selectRole('teacher')">선생님</button>
  <button class="login-button" onclick="selectRole('parent')">학부모</button>
</div>

<!-- APP SHELL -->
<div id="app-shell">
  <!-- TOP BAR -->
  <div class="ios-topbar">
    <div class="ios-topbar-left">
      <button class="ios-hamburger" onclick="toggleDrawer()">
        <span class="mi">menu</span>
      </button>
      <div class="ios-topbar-title" id="topbar-title">홈</div>
    </div>
    <div class="ios-topbar-right">
      <button class="ios-avatar-btn" onclick="toggleDrawer()">HQ</button>
    </div>
  </div>

  <!-- DRAWER OVERLAY -->
  <div class="ios-drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>

  <!-- DRAWER -->
  <nav class="ios-drawer" id="drawer">
    <div class="ios-drawer-header">
      <div class="ios-drawer-title">메뉴</div>
      <button class="ios-drawer-close" onclick="closeDrawer()">
        <span class="mi">close</span>
      </button>
    </div>

    <div id="drawer-content" class="ios-drawer-content">
      <!-- Content injected per role -->
    </div>

    <div class="ios-drawer-section">
      <button class="ios-drawer-item" onclick="logout()">
        <span class="ios-drawer-icon mi">logout</span>
        <span class="ios-drawer-label">로그아웃</span>
      </button>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="ios-main" id="main-content">
    <!-- Page sections injected per role -->
  </div>

  <!-- BOTTOM TAB BAR -->
  <div class="ios-tabbar" id="tabbar">
    <!-- Tab items injected per role -->
  </div>
</div>

<!-- SHARED MODALS LAYER -->
<div id="modal-layer">
  <!-- Modals injected per role -->
</div>

<!-- SHARED SCRIPTS -->
<script>
// ===== ROLE STATE =====
let currentRole = null;
let currentTeacherAdminMode = false;
let currentSection = 'home';

// ===== SEED DATA - HQ =====
var hq_branchData = [
  {name:'강남 센터', tel:'02-1234-5678', addr:'서울 강남구 테헤란로 123', managers:3, students:18, status:'운영 중'},
  {name:'서초 센터', tel:'02-2345-6789', addr:'서울 서초구 서초대로 456', managers:2, students:14, status:'운영 중'},
  {name:'송파 센터', tel:'02-3456-7890', addr:'서울 송파구 올림픽로 789', managers:3, students:10, status:'운영 중'},
];

// ===== SEED DATA - PARENT =====
var parent_noticeContents = {
  '6월 학부모 참관 수업 안내': '안녕하세요, HCIS 강남센터입니다.\n\n6월 학부모 참관 수업을 아래와 같이 안내드립니다.\n\n📅 일시: 2024년 6월 28일 (금) 오후 2시\n📍 장소: 강남 센터 각 반 교실\n\n참관 수업에서는 아이들의 수업 참여 모습과 학습 성과를 직접 확인하실 수 있습니다.\n\n참석 여부를 06월 24일까지 담임 선생님께 알려주시면 감사하겠습니다.',

  '수업 준비물 안내': '안녕하세요, Earth반 담임 박지수 선생님입니다.\n\n다음 주 수업에 필요한 준비물을 안내드립니다.\n\n✏️ 준비물 목록:\n- A4 스케치북 1권\n- 색연필 또는 사인펜\n- 영어 단어장 (기존 사용하던 것)\n\n월요일 수업 시작 전까지 준비해 주시면 감사합니다.',
  '6월 영어 말하기 대회 안내': '안녕하세요, HCIS 강남센터입니다.\n\n6월 영어 말하기 대회를 개최합니다!\n\n📅 대회 일정: 6월 21일 (금) 오후 3시\n📍 장소: 강남 센터 대강의실\n🏆 시상: 금·은·동상 및 참가상\n\n자유 주제로 2~3분 영어 스피치를 준비해 주세요. 많은 참여 바랍니다!'

  document.querySelector('[data-page="parent-' + id + '"]')?.classList.add('active');
  closeDrawer();
}
